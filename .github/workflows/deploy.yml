name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - release/v0.1.0   # 메인 배포 브랜치
      - "cms/**"         # Keystatic CMS가 만드는 브랜치도 직접 배포 가능하도록

  # 수동 실행도 허용
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          KEYSTATIC_GITHUB_CLIENT_ID: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}
          KEYSTATIC_GITHUB_CLIENT_SECRET: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}
          KEYSTATIC_SECRET: ${{ secrets.KEYSTATIC_SECRET }}

      - name: Set Cloudflare Worker secrets
        run: |
          printf '%s' "$KEYSTATIC_GITHUB_CLIENT_ID" | npx wrangler secret put KEYSTATIC_GITHUB_CLIENT_ID
          printf '%s' "$KEYSTATIC_GITHUB_CLIENT_SECRET" | npx wrangler secret put KEYSTATIC_GITHUB_CLIENT_SECRET
          printf '%s' "$KEYSTATIC_SECRET" | npx wrangler secret put KEYSTATIC_SECRET
          printf '%s' "$PUBLIC_SUPABASE_URL" | npx wrangler secret put PUBLIC_SUPABASE_URL
          printf '%s' "$PUBLIC_SUPABASE_ANON_KEY" | npx wrangler secret put PUBLIC_SUPABASE_ANON_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEYSTATIC_GITHUB_CLIENT_ID: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}
          KEYSTATIC_GITHUB_CLIENT_SECRET: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}
          KEYSTATIC_SECRET: ${{ secrets.KEYSTATIC_SECRET }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
